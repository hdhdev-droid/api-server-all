name: Deploy Webhook

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -fsS -X POST "https://awen.3vi.co.kr/api/sys_hosting/deploy-webhook/api-server-all" \
            -H "Authorization: Bearer ${{ secrets.AWEN_DEPLOY_TOKEN }}"
