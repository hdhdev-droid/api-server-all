<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DB 연결 확인 · api-server-all</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        padding: 2rem 1rem;
      }

      .wrap {
        max-width: 960px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.75rem;
        font-weight: 600;
        color: #f8fafc;
      }

      .subtitle {
        margin: 0;
        font-size: 0.9rem;
        color: #94a3b8;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.25rem 1.5rem;
        margin-bottom: 1.25rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      .card-header h2,
      .card > h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #f1f5f9;
      }

      .card-body {
        min-height: 2rem;
      }

      .muted {
        margin: 0;
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .card-desc {
        margin-bottom: 1rem;
      }

      .btn-row,
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      button {
        padding: 0.5rem 1rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: #0f172a;
        background: #38bdf8;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #7dd3fc;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: #64748b;
        color: #f8fafc;
      }

      .btn-secondary:hover:not(:disabled) {
        background: #94a3b8;
      }

      .result {
        margin-top: 0.75rem;
      }

      .result p {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
      }

      .meta {
        margin-top: 0.5rem;
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 600;
        border-radius: 6px;
      }

      .badge-ok {
        background: #22c55e;
        color: #0f172a;
      }

      .badge-error {
        background: #ef4444;
        color: #fff;
      }

      .badge-pii {
        background: #f59e0b;
        color: #0f172a;
      }

      .badge-safe {
        background: #22c55e;
        color: #0f172a;
      }

      .btn-pii {
        background: #f59e0b;
        color: #0f172a;
      }

      .btn-pii:hover:not(:disabled) {
        background: #fbbf24;
      }

      .btn-safe {
        background: #22c55e;
        color: #0f172a;
      }

      .btn-safe:hover:not(:disabled) {
        background: #4ade80;
      }

      .seed-group {
        margin-top: 0.75rem;
      }

      .table-group {
        margin-top: 1rem;
      }

      .table-group-title {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.35rem;
      }

      .table-item-main {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }

      .table-item-desc {
        color: #64748b;
        font-size: 0.75rem;
        font-weight: 400;
      }

      .action-result {
        margin-top: 1rem;
      }

      .table-list {
        margin: 0.75rem 0 0;
        padding-left: 0;
        list-style: none;
      }

      .table-list li {
        border-bottom: 1px solid #334155;
      }

      .table-list li:last-child {
        border-bottom: none;
      }

      .table-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
        padding: 0.6rem 0.25rem;
        font-size: 0.9rem;
        color: #e2e8f0;
        background: transparent;
        border: none;
        cursor: pointer;
        text-align: left;
      }

      .table-item:hover,
      .table-item.active {
        color: #38bdf8;
      }

      .table-item-name {
        font-weight: 500;
      }

      .table-item-count {
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .table-item.active .table-item-count {
        color: #7dd3fc;
      }

      .data-table-wrap {
        margin-top: 0.75rem;
        overflow-x: auto;
        border: 1px solid #334155;
        border-radius: 8px;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.8rem;
      }

      .data-table th,
      .data-table td {
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid #334155;
        text-align: left;
        vertical-align: top;
        white-space: nowrap;
      }

      .data-table th {
        background: #0f172a;
        color: #94a3b8;
        font-weight: 600;
      }

      .data-table td {
        color: #e2e8f0;
      }

      .data-table tbody tr:last-child td {
        border-bottom: none;
      }

      pre.detail {
        margin: 1rem 0 0;
        padding: 1rem;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        font-size: 0.8rem;
        overflow-x: auto;
        color: #cbd5e1;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>DB 연결 확인</h1>
        <p class="subtitle">API 서버 데이터베이스 상태</p>
      </header>

      <section class="card">
        <div class="card-header">
          <h2>연결 상태</h2>
          <button type="button" id="btn-db-check">다시 확인</button>
        </div>
        <div class="card-body" id="db-check-body">
          <p class="muted">연결 확인 중…</p>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>테이블 목록</h2>
          <button type="button" id="btn-tables">목록 불러오기</button>
        </div>
        <div class="card-body" id="tables-body">
          <p class="muted">목록 불러오기 버튼을 누르세요. 개인정보 여부로 구분되며, 테이블을 클릭하면 행 데이터를 볼 수 있습니다.</p>
        </div>
      </section>

      <section class="card" id="table-rows-card" hidden>
        <div class="card-header">
          <h2 id="table-rows-title">테이블 데이터</h2>
        </div>
        <div class="card-body" id="table-rows-body"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>데이터 관리</h2>
        </div>
        <div class="card-body">
          <p class="muted card-desc">
            개인정보/비개인정보 테이블, FK 관계, 이상 컬럼명 개인정보 테이블
            (cust_shadow_bag, id_scrap_bin, reach_out_pad)을 생성·누적합니다.
          </p>
          <div class="btn-group">
            <button type="button" id="btn-setup">테이블 생성</button>
          </div>
          <div class="btn-group seed-group">
            <button type="button" id="btn-seed-personal" class="btn-pii">개인정보 샘플 추가</button>
            <button type="button" id="btn-seed-non-personal" class="btn-safe">비개인정보 샘플 추가</button>
            <button type="button" id="btn-seed-all" class="btn-secondary">전체 샘플 추가</button>
          </div>
          <div id="setup-result"></div>
          <div id="seed-result"></div>
        </div>
      </section>
    </div>

    <script>
      async function request(path, options = {}) {
        const res = await fetch(path, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || data.message || `HTTP ${res.status}`);
        }
        return data;
      }

      function setLoading(el, message) {
        el.innerHTML = `<p class="muted">${message}</p>`;
      }

      function renderDbCheck(el, data) {
        el.innerHTML = `
          <div class="result">
            <span class="badge badge-ok">연결됨</span>
            <p>${data.message}</p>
            <p class="meta">데이터베이스: ${data.database}</p>
          </div>
        `;
      }

      function renderDbError(el, message) {
        el.innerHTML = `
          <div class="result">
            <span class="badge badge-error">연결 실패</span>
            <p>${message}</p>
          </div>
        `;
      }

      function formatCell(value) {
        if (value === null || value === undefined) return '—';
        if (typeof value === 'object') return JSON.stringify(value);
        return String(value);
      }

      function renderTableGroup(title, badgeClass, tables, selectedTableName) {
        if (!tables?.length) return '';
        return `
          <div class="table-group">
            <div class="table-group-title">
              <span class="badge ${badgeClass}">${title}</span>
              <span class="meta">${tables.length}개</span>
            </div>
            <ul class="table-list">
              ${tables
                .map(
                  (table) => `
                <li>
                  <button
                    type="button"
                    class="table-item${selectedTableName === table.name ? ' active' : ''}"
                    data-table-name="${table.name}"
                  >
                    <span class="table-item-main">
                      <span class="table-item-name">${table.name}</span>
                      ${
                        table.description
                          ? `<span class="table-item-desc">${table.description}</span>`
                          : ''
                      }
                    </span>
                    <span class="table-item-count">${table.rowCount}행</span>
                  </button>
                </li>
              `
                )
                .join('')}
            </ul>
          </div>
        `;
      }

      function renderTables(el, data, selectedTableName) {
        if (!data.tables.length) {
          el.innerHTML = `
            <div class="result">
              <p class="meta">데이터베이스: ${data.database} · ${data.count}개 테이블</p>
              <p class="muted">테이블이 없습니다.</p>
            </div>
          `;
          return;
        }

        const groups = data.groups || {};
        el.innerHTML = `
          <div class="result">
            <p class="meta">
              데이터베이스: ${data.database} · ${data.count}개 테이블 ·
              개인정보 ${groups.withPersonalInfo?.length || 0} ·
              비개인정보 ${groups.withoutPersonalInfo?.length || 0}
            </p>
            ${renderTableGroup('개인정보 포함', 'badge-pii', groups.withPersonalInfo, selectedTableName)}
            ${renderTableGroup('개인정보 없음', 'badge-safe', groups.withoutPersonalInfo, selectedTableName)}
            ${renderTableGroup('미분류', 'badge', groups.unclassified, selectedTableName)}
          </div>
        `;

        el.querySelectorAll('[data-table-name]').forEach((button) => {
          button.addEventListener('click', () => loadTableRows(button.dataset.tableName));
        });
      }

      function renderTableRows(data) {
        const card = document.getElementById('table-rows-card');
        const title = document.getElementById('table-rows-title');
        const body = document.getElementById('table-rows-body');

        card.hidden = false;
        title.textContent = `${data.table} 데이터`;

        if (!data.rows.length) {
          body.innerHTML = `
            <div class="result">
              <p class="meta">총 ${data.rowCount}행</p>
              <p class="muted">데이터가 없습니다.</p>
            </div>
          `;
          return;
        }

        body.innerHTML = `
          <div class="result">
            <p class="meta">총 ${data.rowCount}행</p>
            <div class="data-table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    ${data.columns.map((column) => `<th>${column}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${data.rows
                    .map(
                      (row) => `
                    <tr>
                      ${data.columns.map((column) => `<td>${formatCell(row[column])}</td>`).join('')}
                    </tr>
                  `
                    )
                    .join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderActionResult(el, type, title, message, meta) {
        const badgeClass = type === 'success' ? 'badge-ok' : 'badge-error';
        el.innerHTML = `
          <div class="result action-result">
            <span class="badge ${badgeClass}">${title}</span>
            <p>${message}</p>
            ${meta ? `<p class="meta">${meta}</p>` : ''}
          </div>
        `;
      }

      const dbCheckBody = document.getElementById('db-check-body');
      const tablesBody = document.getElementById('tables-body');
      const setupResult = document.getElementById('setup-result');
      const seedResult = document.getElementById('seed-result');
      const btnDbCheck = document.getElementById('btn-db-check');
      const btnTables = document.getElementById('btn-tables');
      const btnSetup = document.getElementById('btn-setup');
      const btnSeedPersonal = document.getElementById('btn-seed-personal');
      const btnSeedNonPersonal = document.getElementById('btn-seed-non-personal');
      const btnSeedAll = document.getElementById('btn-seed-all');
      const seedButtons = [btnSeedPersonal, btnSeedNonPersonal, btnSeedAll];
      let selectedTableName = null;
      let latestTablesData = null;

      async function loadDbCheck() {
        btnDbCheck.disabled = true;
        setLoading(dbCheckBody, '연결 확인 중…');
        try {
          const data = await request('/api/db/check');
          renderDbCheck(dbCheckBody, data);
        } catch (err) {
          renderDbError(dbCheckBody, err.message);
        } finally {
          btnDbCheck.disabled = false;
        }
      }

      async function loadTables() {
        btnTables.disabled = true;
        setLoading(tablesBody, '테이블 목록 불러오는 중…');
        try {
          const data = await request('/api/db/tables');
          latestTablesData = data;
          renderTables(tablesBody, data, selectedTableName);
        } catch (err) {
          tablesBody.innerHTML = `
            <div class="result">
              <span class="badge badge-error">오류</span>
              <p>${err.message}</p>
            </div>
          `;
        } finally {
          btnTables.disabled = false;
        }
      }

      async function loadTableRows(tableName) {
        selectedTableName = tableName;
        if (latestTablesData) {
          renderTables(tablesBody, latestTablesData, selectedTableName);
        }

        const card = document.getElementById('table-rows-card');
        const body = document.getElementById('table-rows-body');
        card.hidden = false;
        setLoading(body, '행 데이터 불러오는 중…');

        try {
          const data = await request(`/api/db/tables/${encodeURIComponent(tableName)}/rows`);
          renderTableRows(data);
        } catch (err) {
          body.innerHTML = `
            <div class="result">
              <span class="badge badge-error">오류</span>
              <p>${err.message}</p>
            </div>
          `;
        }
      }

      async function handleSetup() {
        btnSetup.disabled = true;
        setupResult.innerHTML = '';
        setLoading(setupResult, '테이블 생성 중…');
        try {
          const data = await request('/api/db/setup-tables', { method: 'POST' });
          const names = (data.tables || [])
            .map((table) => (typeof table === 'string' ? table : table.name))
            .join(', ');
          renderActionResult(
            setupResult,
            'success',
            '테이블 생성 완료',
            data.message,
            `생성된 테이블: ${names}`
          );
          await loadTables();
        } catch (err) {
          renderActionResult(setupResult, 'error', '테이블 생성 실패', err.message);
        } finally {
          btnSetup.disabled = false;
        }
      }

      async function handleSeed(scope) {
        seedButtons.forEach((btn) => {
          btn.disabled = true;
        });
        seedResult.innerHTML = '';
        setLoading(seedResult, '샘플 데이터 추가 중…');
        try {
          const query = scope === 'all' ? '' : `?scope=${encodeURIComponent(scope)}`;
          const data = await request(`/api/db/seed-sample-data${query}`, { method: 'POST' });
          const added = data.counts?.added || {};
          const totals = data.counts?.totals || {};
          const addedText =
            Object.entries(added)
              .filter(([, value]) => value > 0)
              .map(([key, value]) => `${key} ${value}`)
              .join(' · ') || '없음';
          const totalsText = Object.entries(totals)
            .map(([key, value]) => `${key} ${value}`)
            .join(' · ');
          renderActionResult(
            seedResult,
            'success',
            '샘플 데이터 추가 완료',
            `${data.message} (scope: ${data.counts?.scope || scope})`,
            `이번 추가: ${addedText} / 현재 합계: ${totalsText}`
          );
          await loadTables();
          if (selectedTableName) {
            await loadTableRows(selectedTableName);
          }
        } catch (err) {
          renderActionResult(seedResult, 'error', '샘플 데이터 추가 실패', err.message);
        } finally {
          seedButtons.forEach((btn) => {
            btn.disabled = false;
          });
        }
      }

      btnDbCheck.addEventListener('click', loadDbCheck);
      btnTables.addEventListener('click', loadTables);
      btnSetup.addEventListener('click', handleSetup);
      btnSeedPersonal.addEventListener('click', () => handleSeed('personal'));
      btnSeedNonPersonal.addEventListener('click', () => handleSeed('non_personal'));
      btnSeedAll.addEventListener('click', () => handleSeed('all'));

      loadDbCheck();
    </script>
  </body>
</html>
